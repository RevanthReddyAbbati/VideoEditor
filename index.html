<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Video Editor Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar for professional look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        /* Crop Overlay Guideline */
        .crop-box {
            border: 2px dashed #3b82f6;
            position: absolute;
            cursor: move;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl shadow-lg shadow-blue-500/20">
                    🎬
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">ClipCraft Studio</span>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700/50 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Client-Side Processing
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[450px] relative overflow-hidden shadow-2xl">
            
            <div id="dropzone" class="w-full h-full min-h-[400px] border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl flex flex-col items-center justify-center gap-4 transition-all cursor-pointer group p-6">
                <input type="file" id="video-input" accept="video/*" class="hidden">
                <div class="p-4 bg-slate-800/50 rounded-full group-hover:scale-110 transition-transform">
                    svg file...
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-400 group-hover:text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </div>
                <div class="text-center">
                    <p class="text-base font-medium text-slate-200">Drag and drop your video file here</p>
                    <p class="text-xs text-slate-400 mt-1">Supports MP4, MOV, MKV, WebM etc.</p>
                </div>
                <button class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2.5 rounded-lg shadow-lg shadow-blue-600/10 transition-colors">Browse Files</button>
            </div>

            <div id="editor-view" class="hidden w-full flex flex-col items-center relative">
                <div class="relative max-w-full overflow-hidden rounded-lg bg-black flex items-center justify-center" id="video-container">
                    <video id="video-player" controls class="max-h-[500px] w-full object-contain"></video>
                    <div id="crop-overlay" class="crop-box hidden" style="top: 10%; left: 10%; width: 80%; height: 80%;"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2">Preview changes layout dynamic to configuration.</p>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
            <h2 class="text-lg font-semibold border-b border-slate-800 pb-3 flex items-center gap-2">
                ⚙️ Toolkit Configuration
            </h2>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Video Tempo / Speed</label>
                <div class="grid grid-cols-4 gap-2">
                    <button data-speed="0.5" class="speed-btn py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">0.5x</button>
                    <button data-speed="1.0" class="speed-btn py-2 text-sm font-medium bg-blue-600 text-white rounded-lg border border-blue-500 transition-all shadow-md shadow-blue-600/20">1x</button>
                    <button data-speed="1.5" class="speed-btn py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">1.5x</button>
                    <button data-speed="2.0" class="speed-btn py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">2x</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Audio Profile</label>
                <label class="flex items-center space-x-3 bg-slate-800/40 p-3 rounded-xl border border-slate-800 cursor-pointer hover:bg-slate-800/80 transition-colors">
                    <input type="checkbox" id="mute-checkbox" class="w-4 h-4 text-blue-600 bg-slate-700 border-slate-600 rounded focus:ring-blue-500 focus:ring-2">
                    <span class="text-sm font-medium text-slate-200">Strip audio completely (Mute)</span>
                </label>
            </div>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Cropping Ratio Preset</label>
                <div class="grid grid-cols-2 gap-2">
                    <button data-crop="none" class="crop-preset-btn py-2 text-xs font-medium bg-blue-600 text-white rounded-lg border border-blue-500 transition-all">Original (Freeform)</button>
                    <button data-crop="1:1" class="crop-preset-btn py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">Square (1:1)</button>
                    <button data-crop="16:9" class="crop-preset-btn py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">Widescreen (16:9)</button>
                    <button data-crop="9:16" class="crop-preset-btn py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all">Portrait (9:16)</button>
                </div>
                <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-slate-400">Toggle Visible Crop Grid:</span>
                    <button id="toggle-crop" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-colors">Enable Crop Window</button>
                </div>
            </div>

            <div class="mt-4 border-t border-slate-800 pt-6">
                <button id="process-btn" disabled class="w-full py-4 px-6 rounded-xl bg-slate-800 text-slate-500 cursor-not-allowed font-semibold tracking-wide transition-all duration-300 flex items-center justify-center gap-3">
                    Select a Video First
                </button>
                
                <div id="progress-container" class="hidden mt-4">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Encoding pipeline active...</span>
                        <span id="progress-percentage">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-950/80 backdrop-blur-md border-t border-slate-900 py-3 text-center z-50">
        <p class="text-xs font-medium text-slate-400 tracking-wider">
            Developed by <span class="text-blue-400 font-semibold drop-shadow-[0_0_10px_rgba(59,130,246,0.2)]">Revanth Reddy Abbati</span>
        </p>
    </footer>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        // Setting logs to true allows us to parse progress stats perfectly from WebAssembly native hooks
        const ffmpeg = createFFmpeg({ log: true });

        // Elements
        const dropzone = document.getElementById('dropzone');
        const videoInput = document.getElementById('video-input');
        const editorView = document.getElementById('editor-view');
        const player = document.getElementById('video-player');
        const processBtn = document.getElementById('process-btn');
        const muteCheckbox = document.getElementById('mute-checkbox');
        const toggleCropBtn = document.getElementById('toggle-crop');
        const cropOverlay = document.getElementById('crop-overlay');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressContainer = document.getElementById('progress-container');

        // State Tracking variables
        let selectedFile = null;
        let activeSpeed = 1.0;
        let isCropActive = false;
        let cropRatio = 'none'; // 'none', '1:1', '16:9', '9:16'
        let duration = 0;

        // Initialize FFmpeg Engine
        async function initFFmpeg() {
            if (!ffmpeg.isLoaded()) {
                try {
                    await ffmpeg.load();
                    console.log("FFmpeg successfully loaded.");
                } catch(e) {
                    alert("SharedArrayBuffer header context missing. Download features might fall back depending on your security matrix.");
                    console.error(e);
                }
            }
        }
        initFFmpeg();

        // Listen for internal execution logging frames to extract explicit current execution progress
        ffmpeg.setProgress(({ ratio }) => {
            let percentage = Math.round(ratio * 100);
            if(percentage >= 0 && percentage <= 100) {
                progressBar.style.width = `${percentage}%`;
                progressPercentage.innerText = `${percentage}%`;
            }
        });

        // Trigger file selections
        dropzone.addEventListener('click', () => videoInput.click());
        videoInput.addEventListener('change', (e) => handleFileSelection(e.target.files[0]));

        // Drag Drop Handling
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-blue-500'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('border-blue-500'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-blue-500');
            if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
        });

        function handleFileSelection(file) {
            if (!file || !file.type.startsWith('video/')) {
                alert('Please upload a valid native video asset file.');
                return;
            }
            selectedFile = file;
            
            // UI State Shift Transitions
            dropzone.classList.add('hidden');
            editorView.classList.remove('hidden');
            
            // Load source track into HTML5 native layout pipeline
            const blobUrl = URL.createObjectURL(file);
            player.src = blobUrl;
            player.load();
            
            player.onloadedmetadata = () => {
                duration = player.duration;
            };

            // Prime Submission Processing Unit Button
            processBtn.disabled = false;
            processBtn.className = "w-full py-4 px-6 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold tracking-wide transition-all duration-300 transform active:scale-[0.99] flex items-center justify-center gap-3 shadow-lg shadow-blue-500/20 cursor-pointer";
            processBtn.innerText = "Export Master Compilation";
        }

        // Tempo Control Button Selectors Matrix
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.speed-btn').forEach(b => b.className = "speed-btn py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all");
                e.target.className = "speed-btn py-2 text-sm font-medium bg-blue-600 text-white rounded-lg border border-blue-500 transition-all shadow-md shadow-blue-600/20";
                activeSpeed = parseFloat(e.target.getAttribute('data-speed'));
                player.playbackRate = activeSpeed; // Apply immediately to active live visual layout review tracker
            });
        });

        // Toggle Visual Mock Crop Mask Layer
        toggleCropBtn.addEventListener('click', () => {
            isCropActive = !isCropActive;
            if(isCropActive) {
                cropOverlay.classList.remove('hidden');
                toggleCropBtn.innerText = "Disable Crop Window";
                toggleCropBtn.classList.add('bg-blue-600', 'text-white');
                applyCropBoxRatio();
            } else {
                cropOverlay.classList.add('hidden');
                toggleCropBtn.innerText = "Enable Crop Window";
                toggleCropBtn.classList.remove('bg-blue-600', 'text-white');
            }
        });

        // Aspect Crop Presets
        document.querySelectorAll('.crop-preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.crop-preset-btn').forEach(b => b.className = "crop-preset-btn py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-all");
                e.target.className = "crop-preset-btn py-2 text-xs font-medium bg-blue-600 text-white rounded-lg border border-blue-500 transition-all";
                cropRatio = e.target.getAttribute('data-crop');
                if(!isCropActive) toggleCropBtn.click();
                applyCropBoxRatio();
            });
        });

        function applyCropBoxRatio() {
            if(!isCropActive) return;
            // Preset boundaries mapping logic for CSS display tracking mockup layouts
            if(cropRatio === 'none' || cropRatio === '1:1') {
                cropOverlay.style.width = "60%"; cropOverlay.style.height = "60%";
                cropOverlay.style.top = "20%"; cropOverlay.style.left = "20%";
            } else if(cropRatio === '16:9') {
                cropOverlay.style.width = "80%"; cropOverlay.style.height = "45%";
                cropOverlay.style.top = "27.5%"; cropOverlay.style.left = "10%";
            } else if(cropRatio === '9:16') {
                cropOverlay.style.width = "35%"; cropOverlay.style.height = "80%";
                cropOverlay.style.top = "10%"; cropOverlay.style.left = "32.5%";
            }
        }

        // Processing & Export pipeline Engine execution logic mapping
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Prevent stacking multiple operations gracefully
            processBtn.disabled = true;
            processBtn.innerText = "Processing Pipeline Active...";
            progressContainer.classList.remove('hidden');

            const inputName = 'input_video.mp4';
            const outputName = 'edited_output.mp4';

            // Write File directly into the virtual virtual context system memory of WebAssembly
            ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

            // Assemble execution commands dynamic complex sequence without losing structural pipeline quality
            // -crf 18 ensures visually lossless encoding optimization configurations maps output matching inputs
            let args = ['-i', inputName];

            // Speed filter mappings combined via filter graphs blocks
            let videoFilter = "";
            
            if (activeSpeed === 0.5) {
                videoFilter += "setpts=2.0*PTS";
            } else if (activeSpeed === 1.0) {
                videoFilter += "setpts=1.0*PTS";
            } else if (activeSpeed === 1.5) {
                videoFilter += "setpts=0.66*PTS";
            } else if (activeSpeed === 2.0) {
                videoFilter += "setpts=0.5*PTS";
            }

            // Append Cropping logic dimensions calculation parameters down matching presets to standard native frame logic structures array sets
            if(isCropActive && cropRatio !== 'none') {
                if(cropRatio === '1:1') videoFilter += ",crop=in_h:in_h:in_w/2-out_w/2:0";
                if(cropRatio === '16:9') videoFilter += ",crop=in_w:in_w*(9/16):0:in_h/2-out_h/2";
                if(cropRatio === '9:16') videoFilter += ",crop=in_h*(9/16):in_h:in_w/2-out_w/2:0";
            }

            if(videoFilter !== "") {
                args.push('-vf', videoFilter);
            }

            // Audio track processing checks conditions
            if (muteCheckbox.checked) {
                args.push('-an'); // Drop sound array mappings entirely
            } else {
                // Adjust audio tempo dynamically if speed changes to keep track in absolute sync
                if (activeSpeed === 0.5) args.push('-af', 'atempo=0.5');
                if (activeSpeed === 1.5) args.push('-af', 'atempo=1.5');
                if (activeSpeed === 2.0) args.push('-af', 'atempo=2.0');
            }

            // High Quality Compression Parameter Settings
            args.push('-c:v', 'libx264', '-crf', '18', '-preset', 'ultrafast', outputName);

            // Execute processing script array sequence sets inside background sandbox matrix
            await ffmpeg.run(...args);

            // Read absolute compilation blocks back out from filesystem space tracking blocks
            const data = ffmpeg.FS('readFile', outputName);

            // Construct Download Trigger element anchor link
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `clipcraft_studio_export_${Date.now()}.mp4`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);

            // Housekeeping system tracking context cleanups references safely parameters memory structures arrays
            ffmpeg.FS('unlink', inputName);
            ffmpeg.FS('unlink', outputName);

            // Restoring Operational Buttons back states
